<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fábrica PLC</title>
    <meta name="description" content="Simulador web de fábrica con PLC virtual (IEC 61131-3). Basado en Open Industry Project (MIT)." />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#17181b" />
    <script>
      // La portada solo lleva al simulador; ?portada la deja a la vista.
      if (!new URLSearchParams(location.search).has('portada')) location.replace('/app/' + location.hash)
    </script>
    <style>
      :root { color-scheme: dark; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #17181b; color: #eceae6;
             font: 16px/1.5 Inter, 'Segoe UI', Roboto, Arial, sans-serif; }
      main { max-width: 560px; padding: 32px 16px; text-align: center; }
      img { width: min(100%, 360px); height: auto; }
      a.boton { display: inline-block; margin: 24px 0; padding: 12px 28px; border-radius: 8px; background: #e8731c;
                color: #17181b; font-weight: 700; text-decoration: none; }
      p.creditos { color: #9aa3ae; font-size: 13px; }
      p.creditos a { color: #c8cdd3; }
    </style>
  </head>
  <body>
    <main>
      <img src="/oip-logo.svg" alt="Fábrica PLC" />
      <p>Monta tu fábrica, programa su PLC virtual y ponla en marcha.</p>
      <a class="boton" href="/app/">Abrir la fábrica</a>
      <p class="creditos">
        Basado en <a href="https://github.com/Open-Industry-Project/Open-Industry-Project">Open Industry Project</a>
        (licencia MIT, © Automation Standard LLC and Contributors). Proyecto independiente, sin afiliación.
        <a href="/LICENSE">Licencia</a> · <a href="/THIRD_PARTY_NOTICES.md">Avisos de terceros</a>
      </p>
    </main>
  </body>
</html>
