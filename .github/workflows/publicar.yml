name: Publicar en GitHub Pages

# Cada push a main compila la app y la publica en GitHub Pages (la app vive en <sitio>/app/).
# Requiere Settings > Pages > Build and deployment > Source: "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (mismo pin que el proyecto original)
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 (mismo pin que el proyecto original)
        with:
          node-version: 24
          cache: npm
      - id: pages
        uses: actions/configure-pages@v5
      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund
      - name: Compilar
        run: npm run build
      - name: Ajustar rutas al subdirectorio de Pages
        # Un repositorio de proyecto se sirve en /<repo>/; el de usuario (<usuario>.github.io), en la raíz (base vacía).
        run: node scripts/rebase-dist.mjs dist "${{ steps.pages.outputs.base_path }}"
      - name: Desactivar Jekyll
        run: touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publicar:
    needs: compilar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
